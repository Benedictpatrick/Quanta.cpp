plugins {
    id "com.android.application"
}

// The model ships inside the APK as an uncompressed asset (Firebase Test Lab allows APKs up to 2 GB).
// Pick another file with -PquantaModel=../models/<file>.qnt
def modelFile = file(project.findProperty("quantaModel") ?: "../../models/qwen2.5-0.5b-q4mix-sl.qnt")
def modelAssets = layout.buildDirectory.dir("modelassets")

tasks.register("copyModel", Copy) {
    from(modelFile)
    into(modelAssets)
    rename { "model.qnt" }
}

android {
    namespace "dev.quanta"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "dev.quanta"
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge layout; revisit with window insets
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a", "x86_64" }  // x86_64: runs on Test Lab virtual devices (smoke test)
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_static" }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // test builds: signed with the debug key so they install anywhere
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main { assets.srcDirs += modelAssets }
    }

    androidResources {
        noCompress += "qnt"  // stored raw: fast to copy out, no inflating 450 MB
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild") { dependsOn("copyModel") }
